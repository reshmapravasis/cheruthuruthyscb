<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gallery - Cheruthuruthy Service Co-operative Bank</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&family=Noto+Sans+Malayalam:wght@400;600;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>

    <!-- Header -->
    <div id="header-placeholder"></div>

    <!-- Page Title -->
    <div style="background: var(--primary-blue); color: var(--white); padding: 4rem 5%; text-align: center;">
        <h1 style="font-size: 2.5rem; margin-bottom: 0.5rem;">
            <span class="lang-en">Photo Gallery</span>
            <span class="lang-ml">ഫോട്ടോ ഗാലറി</span>
        </h1>
        <p>
            <span class="lang-en">Glimpses of our events and facilities</span>
            <span class="lang-ml">ഞങ്ങളുടെ പരിപാടികളുടെയും സൗകര്യങ്ങളുടെയും കാഴ്ചകൾ</span>
        </p>
    </div>

    <!-- Gallery Content -->
    <section class="section">
        <div class="gallery-grid">
            <div class="gallery-item">
                <div style="width: 100%; height: 100%; background: linear-gradient(45deg, #0056b3, #00aaff); display: flex; align-items: center; justify-content: center; color: white; font-size: 2rem;">
                    <i class="fas fa-building"></i>
                </div>
            </div>
            <div class="gallery-item">
                <div style="width: 100%; height: 100%; background: linear-gradient(45deg, #00aaff, #0056b3); display: flex; align-items: center; justify-content: center; color: white; font-size: 2rem;">
                    <i class="fas fa-users"></i>
                </div>
            </div>
            <div class="gallery-item">
                <div style="width: 100%; height: 100%; background: linear-gradient(45deg, #0056b3, #e6f0fa); display: flex; align-items: center; justify-content: center; color: #0056b3; font-size: 2rem;">
                    <i class="fas fa-handshake"></i>
                </div>
            </div>
            <div class="gallery-item">
                <div style="width: 100%; height: 100%; background: linear-gradient(45deg, #e6f0fa, #00aaff); display: flex; align-items: center; justify-content: center; color: #0056b3; font-size: 2rem;">
                    <i class="fas fa-award"></i>
                </div>
            </div>
            <div class="gallery-item">
                <div style="width: 100%; height: 100%; background: linear-gradient(45deg, #00aaff, #e6f0fa); display: flex; align-items: center; justify-content: center; color: white; font-size: 2rem;">
                    <i class="fas fa-chart-line"></i>
                </div>
            </div>
            <div class="gallery-item">
                <div style="width: 100%; height: 100%; background: linear-gradient(45deg, #0056b3, #004494); display: flex; align-items: center; justify-content: center; color: white; font-size: 2rem;">
                    <i class="fas fa-landmark"></i>
                </div>
            </div>
        </div>
    </section>

    <!-- Footer -->
    <div id="footer-placeholder"></div>

    <script src="js/script.js"></script>
</body>
</html>
